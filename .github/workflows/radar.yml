name: Last Asylum Code Radar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_PATH: data/state.json
        run: python -m watcher

      - name: Publish dashboard data
        run: |
          cp data/state.json docs/state.json

      - name: Commit state
        run: |
          git config user.name "last-asylum-radar"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json docs/state.json
          git diff --cached --quiet || git commit -m "chore: update code radar state"
          git push

  pages:
    needs: radar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
