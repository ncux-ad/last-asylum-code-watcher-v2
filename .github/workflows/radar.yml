name: Last Asylum Code Radar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      manual_code:
        description: "Post this already-known code to Telegram now, bypassing auto-notify (leave empty for a normal scan run)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Post one code manually
        if: github.event.inputs.manual_code != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          STATE_PATH: data/state.json
        run: python -m watcher.manual_post "${{ github.event.inputs.manual_code }}"

      - name: Scan
        if: github.event.inputs.manual_code == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          STATE_PATH: data/state.json
        run: python -m watcher

      - name: Publish dashboard data
        run: |
          cp data/state.json docs/state.json

      - name: Commit state
        run: |
          git config user.name "last-asylum-radar"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json docs/state.json
          git diff --cached --quiet || git commit -m "chore: update code radar state"
          git push

  pages:
    needs: radar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - uses: actions/deploy-pages@v5
