image: python:3.12-slim

variables:
  STATE_PATH: "data/state.json"
  MANUAL_CODE: ""
  GIT_STRATEGY: clone

radar:
  stage: build
  before_script:
    - pip install -r requirements.txt
  script:
    - |
      if [ -n "$MANUAL_CODE" ]; then
        python -m watcher.manual_post "$MANUAL_CODE"
      else
        python -m watcher
      fi
    - cp data/state.json docs/state.json
    - git config user.name "last-asylum-radar"
    - git config user.email "radar@users.noreply.gitlab.com"
    - git add data/state.json docs/state.json
    - |
      if ! git diff --cached --quiet; then
        git commit -m "chore: update code radar state"
        git push "https://gitlab-ci-token:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

pages:
  stage: deploy
  needs: ["radar"]
  script:
    - mkdir -p public
    - cp -r docs/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
