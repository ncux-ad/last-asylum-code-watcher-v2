# fenix-clan.ru / fenix-clan.online — статический сайт клана + /promocodes/
# (данные радара). fenix-clan.online — второй домен-зеркало, отдаёт тот же
# root, отдельного контента под него нет.
# Разместить в /etc/nginx/sites-available/ и сделать симлинк в sites-enabled.
# После правок: sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО: этот файл — только HTTP (80), без блока :443. DNS на момент
# написания ещё не указывал на этот сервер, поэтому certbot нечего было
# выпускать. Как только A/AAAA-записи обоих доменов пропишут на этот сервер
# и пропагация DNS завершится:
#   sudo certbot --nginx -d fenix-clan.ru -d www.fenix-clan.ru -d fenix-clan.online -d www.fenix-clan.online
# certbot сам допишет 443-блок(и) с SSL и редирект с 80 на 443 — этот файл
# после этого руками не трогать, дальше им управляет certbot.
server {
    listen 80;
    listen [::]:80;
    server_name fenix-clan.ru www.fenix-clan.ru fenix-clan.online www.fenix-clan.online;

    root /var/www/fenix-clan.ru;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /promocodes/ {
        try_files $uri $uri/ =404;
    }
}
