<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Asylum: Plague — Code Radar</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:40px auto;padding:0 18px;background:#0d1117;color:#e6edf3}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px;margin:12px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #30363d}
.badge{padding:4px 8px;border-radius:8px;background:#21262d}.code{font-family:monospace;font-size:1.1em}
small{color:#8b949e}a{color:#58a6ff}
.code{cursor:pointer}
.copy-btn{margin-left:8px;padding:2px 8px;font-size:.9em;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;cursor:pointer;pointer-events:none}
.copy-btn.copied{background:#238636;border-color:#238636;color:#fff}
</style>
</head>
<body>
<h1>Last Asylum: Plague — Code Radar</h1>
<div id="summary"></div>
<div class="card"><table><thead><tr>
<th>Code</th><th>Status</th><th>Confidence</th><th>Sources</th><th>First seen</th><th>Last seen</th>
</tr></thead><tbody id="codes"></tbody></table></div>
<script>
async function load(){
 const r=await fetch('state.json?'+Date.now()); const d=await r.json();
 const items=Object.values(d.codes).sort((a,b)=>b.confidence-a.confidence);
 document.getElementById('summary').innerHTML =
 `<div class="card"><b>${items.length}</b> known codes · <b>${items.filter(x=>x.status==='confirmed').length}</b> confirmed · <b>${d.events.length}</b> recent events</div>`;
 document.getElementById('codes').innerHTML=items.map(x=>`
 <tr><td class="code" data-code="${x.code}" title="Нажмите, чтобы скопировать">${x.code}<button class="copy-btn">Копировать</button></td>
 <td><span class="badge">${x.status}</span></td>
 <td>${Math.round(x.confidence*100)}%</td>
 <td>${Object.entries(x.sources).map(([s,v])=>v.url?`<a href="${v.url}">${s}</a>`:s).join(', ')}</td>
 <td><small>${new Date(x.first_seen).toLocaleString()}</small></td>
 <td><small>${new Date(x.last_seen).toLocaleString()}</small></td></tr>`).join('');
}

async function copyCode(text){
 if(navigator.clipboard){
  await navigator.clipboard.writeText(text);
  return;
 }
 const ta=document.createElement('textarea');
 ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
 document.body.appendChild(ta); ta.select();
 document.execCommand('copy');
 document.body.removeChild(ta);
}

document.getElementById('codes').addEventListener('click', async (e)=>{
 const cell=e.target.closest('.code');
 if(!cell) return;
 const btn=cell.querySelector('.copy-btn');
 try{
  await copyCode(cell.dataset.code);
  const prev=btn.textContent;
  btn.textContent='Скопировано';
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent=prev; btn.classList.remove('copied'); }, 1200);
 }catch(err){
  console.error('copy failed', err);
 }
});

load();
</script>
</body>
</html>
