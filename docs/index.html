<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Asylum: Plague — Code Radar</title>
<script data-goatcounter="https://last-asylum-radar.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px;background:#0d1117;color:#e6edf3}
h1{font-size:1.25em;margin:8px 0 16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin:10px 0}
.summary{display:flex;gap:18px;flex-wrap:wrap;font-size:.95em}
a{color:#58a6ff}

.history-title{color:#8b949e;font-size:.85em;margin-bottom:8px}
.history-chart{display:block;overflow:visible}
.history-chart rect{transition:fill .15s}

.item{display:flex;flex-direction:column;gap:8px}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.code{font-family:monospace;font-size:1.15em;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.copy-btn{padding:5px 12px;font-size:.85em;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;pointer-events:none}
.copy-btn.copied{background:#238636;border-color:#238636;color:#fff}

.badges{display:flex;gap:8px;align-items:center;font-size:.9em;white-space:nowrap}
.badge{padding:3px 8px;border-radius:8px;background:#21262d}
.badge.confirmed{background:#0f5132;color:#7ee787}
.badge.probable{background:#3f2d00;color:#d29922}
.badge.candidate{background:#21262d;color:#8b949e}
.badge.expired-flag{background:#4c1116;color:#ff7b72}

.meta{color:#8b949e;font-size:.85em}
.meta.expired{color:#ff7b72}
details{margin-top:2px}
summary{cursor:pointer;color:#58a6ff;font-size:.9em;user-select:none;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";display:inline-block}
details[open] summary::before{content:"▾ "}
.sources{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:.9em}

@media (max-width:420px){
 .item-top{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<h1>Last Asylum: Plague — Code Radar</h1>
<div id="summary"></div>
<div id="history"></div>
<div id="list"></div>
<script>
function buildHistoryChart(events){
 const days = 30;
 const today = new Date(); today.setUTCHours(0,0,0,0);
 const keys = [];
 const counts = new Map();
 for(let i=days-1;i>=0;i--){
  const d = new Date(today); d.setUTCDate(d.getUTCDate()-i);
  const key = d.toISOString().slice(0,10);
  keys.push(key);
  counts.set(key, 0);
 }
 events.filter(e=>e.kind==='new').forEach(e=>{
  const key = (e.at||'').slice(0,10);
  if(counts.has(key)) counts.set(key, counts.get(key)+1);
 });
 const values = keys.map(k=>counts.get(k));
 const max = Math.max(1, ...values);
 const w = 600, h = 100, gap = 2, bw = w/days;
 const bars = values.map((v,i)=>{
  const bh = v ? Math.max(3, (v/max)*(h-16)) : 2;
  const x = i*bw;
  const y = h - bh;
  const color = v>0 ? '#58a6ff' : '#21262d';
  return `<rect x="${x+gap/2}" y="${y}" width="${Math.max(1,bw-gap)}" height="${bh}" rx="1.5" fill="${color}"><title>${keys[i]}: ${v} new</title></rect>`;
 }).join('');
 const total = values.reduce((a,b)=>a+b,0);
 return { total, svg: `<svg class="history-chart" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${bars}</svg>` };
}

async function load(){
 const r=await fetch('state.json?'+Date.now()); const d=await r.json();
 const items=Object.values(d.codes).sort((a,b)=>b.confidence-a.confidence);
 document.getElementById('summary').innerHTML =
 `<div class="card summary"><div><b>${items.length}</b> known codes</div><div><b>${items.filter(x=>x.status==='confirmed').length}</b> confirmed</div><div><b>${d.events.length}</b> recent events</div></div>`;

 const chart = buildHistoryChart(d.events||[]);
 document.getElementById('history').innerHTML =
 `<div class="card"><div class="history-title">Новые коды за 30 дней · всего ${chart.total}</div>${chart.svg}</div>`;

 document.getElementById('list').innerHTML = items.map(x=>{
  const sources = Object.entries(x.sources);
  const rewardLine = x.reward ? `<div class="meta">Награда: ${x.reward}</div>` : '';
  const expiryLine = x.expires_at
   ? `<div class="meta${x.expired?' expired':''}">${x.expired?'Истёк':'Истекает'}: ${x.expires_at}</div>`
   : '';
  const expiredBadge = x.expired ? `<span class="badge expired-flag">expired</span>` : '';
  return `
  <div class="card item">
   <div class="item-top">
    <div class="code" data-code="${x.code}" title="Нажмите, чтобы скопировать">${x.code}<button class="copy-btn">Копировать</button></div>
    <div class="badges">${expiredBadge}<span class="badge ${x.status}">${x.status}</span><span>${Math.round(x.confidence*100)}%</span></div>
   </div>
   ${rewardLine}
   ${expiryLine}
   <div class="meta">Впервые: ${new Date(x.first_seen).toLocaleString()} · Обновлено: ${new Date(x.last_seen).toLocaleString()}</div>
   <details>
    <summary>Источники (${sources.length})</summary>
    <div class="sources">${sources.map(([s,v])=>v.url?`<a href="${v.url}">${s}</a>`:`<span>${s}</span>`).join('')}</div>
   </details>
  </div>`;
 }).join('');
}

async function copyCode(text){
 if(navigator.clipboard){
  await navigator.clipboard.writeText(text);
  return;
 }
 const ta=document.createElement('textarea');
 ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
 document.body.appendChild(ta); ta.select();
 document.execCommand('copy');
 document.body.removeChild(ta);
}

document.getElementById('list').addEventListener('click', async (e)=>{
 const cell=e.target.closest('.code');
 if(!cell) return;
 const btn=cell.querySelector('.copy-btn');
 try{
  await copyCode(cell.dataset.code);
  const prev=btn.textContent;
  btn.textContent='Скопировано';
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent=prev; btn.classList.remove('copied'); }, 1200);
 }catch(err){
  console.error('copy failed', err);
 }
});

load();
</script>
</body>
</html>
