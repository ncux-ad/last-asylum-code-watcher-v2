<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Asylum: Plague — Code Radar</title>
<script data-goatcounter="https://last-asylum-radar.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px;background:#0d1117;color:#e6edf3}
h1{font-size:1.25em;margin:8px 0 16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin:10px 0}
.summary{display:flex;gap:18px;flex-wrap:wrap;font-size:.95em}
a{color:#58a6ff}

.item{display:flex;flex-direction:column;gap:8px}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.code{font-family:monospace;font-size:1.15em;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.copy-btn{padding:5px 12px;font-size:.85em;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;pointer-events:none}
.copy-btn.copied{background:#238636;border-color:#238636;color:#fff}

.badges{display:flex;gap:8px;align-items:center;font-size:.9em;white-space:nowrap}
.badge{padding:3px 8px;border-radius:8px;background:#21262d}
.badge.confirmed{background:#0f5132;color:#7ee787}
.badge.probable{background:#3f2d00;color:#d29922}
.badge.candidate{background:#21262d;color:#8b949e}
.badge.expired-flag{background:#4c1116;color:#ff7b72}

.mv-badge{display:inline-block;font-size:.85em;padding:5px 10px;border-radius:8px;cursor:help;width:fit-content}
.mv-badge.mv-ok{background:#0f5132;color:#7ee787}
.mv-badge.mv-bad{background:#4c1116;color:#ff7b72}

.meta{color:#8b949e;font-size:.85em}
.meta.expired{color:#ff7b72}
details{margin-top:2px}
summary{cursor:pointer;color:#58a6ff;font-size:.9em;user-select:none;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";display:inline-block}
details[open] summary::before{content:"▾ "}
.sources{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:.9em}

.expired-block{margin:16px 0}
.expired-block>summary{font-size:.95em;padding:6px 2px}
.expired-items{margin-top:6px}

.controls{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}
.search-input{flex:1;min-width:180px;padding:10px 12px;font-size:1em;background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:8px}
.search-input:focus{outline:none;border-color:#58a6ff}
.sort-select{padding:10px 12px;font-size:.9em;background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:8px}
.no-results{color:#8b949e;text-align:center;padding:20px}

@media (max-width:420px){
 .item-top{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<h1>Last Asylum: Plague — Code Radar</h1>
<div id="summary"></div>
<div class="controls">
 <input id="search" class="search-input" type="text" placeholder="Поиск по коду...">
 <select id="sort" class="sort-select">
  <option value="new">Сначала новые</option>
  <option value="confidence">Сначала надёжные</option>
 </select>
</div>
<div id="list"></div>
<div id="expired-list"></div>
<script>
const MV_LABELS = {
 ok: {text: 'Работает', cls: 'mv-ok'},
 invalid: {text: 'Код недействителен', cls: 'mv-bad'},
 used: {text: 'Уже использован на проверенном аккаунте', cls: 'mv-bad'},
 expired: {text: 'Истёк', cls: 'mv-bad'},
};

function isExpired(x){
 return x.expired === true || x.manual_verification?.result === 'expired';
}

function renderCard(x){
 const sources = Object.entries(x.sources);
 const rewardLine = x.reward ? `<div class="meta">Награда: ${x.reward}</div>` : '';
 const expiryLine = x.expires_at
  ? `<div class="meta${x.expired?' expired':''}">${x.expired?'Истёк':'Истекает'}: ${x.expires_at}</div>`
  : '';
 const expiredBadge = x.expired ? `<span class="badge expired-flag">expired</span>` : '';
 const mv = x.manual_verification;
 const manualLine = mv ? (() => {
  const l = MV_LABELS[mv.result] || {text: mv.result, cls: 'mv-bad'};
  const date = new Date(mv.verified_at).toLocaleDateString();
  return `<div class="mv-badge ${l.cls}" title="Проверено вручную на одном аккаунте/сервере — на других может отличаться">✓ Проверено вручную: ${l.text} (${date})</div>`;
 })() : '';
 return `
 <div class="card item">
  <div class="item-top">
   <div class="code" data-code="${x.code}" title="Нажмите, чтобы скопировать">${x.code}<button class="copy-btn">Копировать</button></div>
   <div class="badges">${expiredBadge}<span class="badge ${x.status}">${x.status}</span><span>${Math.round(x.confidence*100)}%</span></div>
  </div>
  ${manualLine}
  ${rewardLine}
  ${expiryLine}
  <div class="meta">Впервые: ${new Date(x.first_seen).toLocaleString()} · Обновлено: ${new Date(x.last_seen).toLocaleString()}</div>
  <details>
   <summary>Источники (${sources.length})</summary>
   <div class="sources">${sources.map(([s,v])=>v.url?`<a href="${v.url}">${s}</a>`:`<span>${s}</span>`).join('')}</div>
  </details>
 </div>`;
}

let ALL_ITEMS = [];
let ALL_EVENTS = [];

function sortByConfidence(a,b){
 const aWorks = a.manual_verification?.result === 'ok' ? 1 : 0;
 const bWorks = b.manual_verification?.result === 'ok' ? 1 : 0;
 if(aWorks !== bWorks) return bWorks - aWorks;
 return b.confidence - a.confidence;
}

function sortByNewest(a,b){
 return new Date(b.first_seen) - new Date(a.first_seen);
}

function render(){
 const query = document.getElementById('search').value.trim().toUpperCase();
 const sortMode = document.getElementById('sort').value;
 const sortFn = sortMode === 'new' ? sortByNewest : sortByConfidence;

 const filtered = query
  ? ALL_ITEMS.filter(x => x.code.toUpperCase().includes(query))
  : ALL_ITEMS;
 const items = [...filtered].sort(sortFn);

 document.getElementById('summary').innerHTML =
 `<div class="card summary"><div><b>${ALL_ITEMS.length}</b> known codes</div><div><b>${ALL_ITEMS.filter(x=>x.status==='confirmed').length}</b> confirmed</div><div><b>${ALL_EVENTS.length}</b> recent events</div></div>`;

 const activeItems = items.filter(x=>!isExpired(x));
 const expiredItems = items.filter(isExpired);

 document.getElementById('list').innerHTML = activeItems.length
  ? activeItems.map(renderCard).join('')
  : (query ? '<div class="no-results">Ничего не найдено</div>' : '');

 document.getElementById('expired-list').innerHTML = expiredItems.length ? `
 <details class="expired-block">
  <summary>Истёкшие коды (${expiredItems.length})</summary>
  <div class="expired-items">${expiredItems.map(renderCard).join('')}</div>
 </details>` : '';
}

async function load(){
 const r=await fetch('state.json?'+Date.now()); const d=await r.json();
 ALL_ITEMS = Object.values(d.codes);
 ALL_EVENTS = d.events;
 render();
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('sort').addEventListener('change', render);

async function copyCode(text){
 if(navigator.clipboard){
  await navigator.clipboard.writeText(text);
  return;
 }
 const ta=document.createElement('textarea');
 ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
 document.body.appendChild(ta); ta.select();
 document.execCommand('copy');
 document.body.removeChild(ta);
}

document.getElementById('list').addEventListener('click', async (e)=>{
 const cell=e.target.closest('.code');
 if(!cell) return;
 const btn=cell.querySelector('.copy-btn');
 try{
  await copyCode(cell.dataset.code);
  const prev=btn.textContent;
  btn.textContent='Скопировано';
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent=prev; btn.classList.remove('copied'); }, 1200);
 }catch(err){
  console.error('copy failed', err);
 }
});

load();
</script>
</body>
</html>
